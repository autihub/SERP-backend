server:
  port: 8080
  servlet:
    # 统一接口前缀 /api，与前端 axios baseURL(/api) 对齐
    context-path: /api

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  mvc:
    # 让未知路径抛 NoHandlerFoundException，由全局异常处理器统一返回 404
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  # ===== 数据库连接（P0-04）：全部走环境变量，本地用默认值 =====
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:serp}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ===== Flyway（P0-05）：启动时自动迁移，新环境无需手工建表 =====
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

# ===== MyBatis-Plus =====
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===== Actuator：仅暴露健康检查 =====
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.shanhai.serp: debug
    org.flywaydb: info
